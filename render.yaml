# One-click hosting on Render (free tier supports WebSockets).
# Dashboard -> New -> Blueprint -> pick this repo -> fill the secrets it asks for.
# The free Postgres below keeps the khata across restarts and redeploys
# (the free web service's own disk is wiped every time it sleeps or redeploys).
databases:
  - name: namma-chotu-db
    plan: free
    databaseName: khata
    user: khata

services:
  - type: web
    name: namma-chotu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GNANI_API_KEY
        sync: false          # you type it in Render's dashboard; never in the repo
      - key: LLM_API_KEY
        sync: false          # Groq or xAI key (see README "Understanding")
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: PICOVOICE_ACCESS_KEY
        sync: false          # "Hey Chotu" wake word; the .ppn file goes in web/wake/
      - key: NLU_MODE
        value: llm
      - key: VOICE_MODE
        value: gnani
      - key: GNANI_STT_LANGUAGES
        value: indic-auto
      - key: DATABASE_URL
        fromDatabase:
          name: namma-chotu-db
          property: connectionString
      - key: LEDGER_KEY
        generateValue: true  # encrypts names at rest; must stay the same across restarts
      - key: SEED_DEMO
        value: "1"
